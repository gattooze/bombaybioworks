name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths: ['hivemind/**']
  pull_request:
    branches: [main]
    paths: ['hivemind/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The hosting action posts a check run and a preview-link comment on PRs.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hivemind/package-lock.json

      - name: Install, test and build
        working-directory: hivemind
        run: |
          npm ci
          npm test
          npm run build

      - name: Deploy to Firebase Hosting (live)
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOMBAY_BIOWORKS }}
          channelId: live
          projectId: bombay-bioworks
          entryPoint: hivemind

      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOMBAY_BIOWORKS }}
          projectId: bombay-bioworks
          entryPoint: hivemind

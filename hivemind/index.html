<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=https://hivemind.bombaybioworks.com" />
  <title>Hivemind · Bombay Bioworks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; font-family: Inter, sans-serif; background: #f2f5f2; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; border: 1px solid rgba(0,0,0,.07); padding: 32px 40px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.07); max-width: 360px; }
    h1 { margin: 0 0 8px; font-size: 18px; font-weight: 600; color: #3e6448; letter-spacing: -0.02em; }
    p  { margin: 0 0 20px; font-size: 14px; color: rgba(10,10,10,.5); }
    a  { display: inline-block; background: #3e6448; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 7px; font-size: 14px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 4px 12px rgba(62,100,72,.2); }
    a:hover { background: #2d4c34; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧠 Hivemind</h1>
    <p>Internal platform for Bombay Bioworks.<br>Moving you there now…</p>
    <a href="https://hivemind.bombaybioworks.com">Open Hivemind →</a>
  </div>
  <script>setTimeout(() => location.replace('https://hivemind.bombaybioworks.com'), 800);</script>
</body>
</html>

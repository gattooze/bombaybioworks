  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { forest: { 50:'#f0f7f1',100:'#c8e4d0',200:'#9fd0ab',300:'#6ba870',400:'#4f7a59',500:'#3e6448',600:'#36583f',700:'#2d4c34',800:'#1e3222',900:'#132118' } },
        fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
      } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>

  <!-- React + Babel (zero build) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase compat SDK (no bundler required) -->

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    html { scroll-behavior: smooth; }
    body { background: #f2f5f2; }
    .hex-bg { background-color:#f2f5f2; background-image: radial-gradient(#c8e4d055 1.5px, transparent 1.5px); background-size: 22px 22px; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #3e6448; border-radius: 10px; }
    /* Quill tweaks */
    .ql-toolbar.ql-snow, .ql-container.ql-snow { border-color:#cbd5e1; }
    .ql-toolbar.ql-snow { border-top-left-radius:.5rem; border-top-right-radius:.5rem; background:#f2f5f2; position:sticky; top:0; z-index:5; }
    .ql-container.ql-snow { border-bottom-left-radius:.5rem; border-bottom-right-radius:.5rem; font-family:Inter,sans-serif; font-size:14px; }
    .ql-editor { min-height: 200px; }
    /* read-only rendered notes */
    .note-render .ql-editor { min-height:0; padding:0; }
    .note-render.ql-snow { border:none; }
  </style>
</head>
<body class="hex-bg text-slate-800">
  <div id="root" class="p-10 text-center text-forest-600">Loading Hivemind…</div>
  <script>
    // Compile the JSX app with the CLASSIC runtime (uses the UMD React global, no ES imports).
    (async () => {
      try {
        const src = await (await fetch('app.jsx?v=' + Date.now())).text();
        const { code } = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] });
        const s = document.createElement('script');
        s.textContent = code;
        document.body.appendChild(s);
      } catch (e) {
        document.getElementById('root').innerHTML =
          '<div style="color:#b45309;padding:2rem">Failed to load Hivemind: ' + e.message + '</div>';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
